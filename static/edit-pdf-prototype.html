<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDFaspect — Edit PDF text</title>
<style>
body{margin:0;background:#f3f6fb;color:#152b43;font:15px system-ui,sans-serif}
header{padding:16px 24px;background:#102b4b;color:white;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header strong{font-size:21px}button,.upload{border:0;border-radius:8px;background:#f78d39;color:#152b43;padding:10px 14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}main{max-width:1000px;margin:20px auto;padding:0 16px}
#pages{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;justify-items:center}.page{position:relative;box-shadow:0 5px 24px #17304b33;background:white;max-width:100%;min-width:0;height:auto!important;aspect-ratio:var(--page-ratio)}
.page img{display:block;width:100%;height:100%}.span{position:absolute;z-index:2;cursor:text;outline:1px solid transparent;min-height:22px;touch-action:manipulation}
.span:hover,.span:focus{outline:2px solid #fa8a2d;background:#fba65022}.span[data-edited="true"]{outline:1px solid #16a085}.span.editing{z-index:4;outline:2px solid #fa8a2d}
#editor{position:sticky;top:0;z-index:3;background:white;padding:14px;box-shadow:0 2px 12px #17304b20;border-radius:10px;margin-bottom:18px}
#replacement{display:block;box-sizing:border-box;width:100%;min-height:24px;margin:0;padding:0;border:0;background:white;font:inherit;line-height:1.2;resize:none;overflow:hidden;outline:none}
#status{padding:12px 0}small{color:#516478}
</style>
</head>
<body>
<header><strong>PDFaspect — Edit PDF</strong><label class="upload">Open PDF <input type="file" id="file" accept="application/pdf" hidden></label><button id="undo" disabled>Undo</button><button id="save" disabled>Download PDF</button></header>
<main><section id="editor" hidden><b id="selection"></b><p><button id="apply">Apply text</button> <button id="cancel">Cancel</button></p><small>Type directly on the page. Enter adds a line; Ctrl+Enter applies the text. Clear the text to delete it.</small><textarea id="replacement" aria-label="Replacement text" maxlength="2000"></textarea></section><div id="status" role="status">Choose a PDF, then click its text to edit.</div><div id="pages"></div></main>
<script type="module" src="/static/edit-pdf-prototype.js"></script></body></html>
