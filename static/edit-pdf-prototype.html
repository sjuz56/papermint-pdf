<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDFaspect — Text editor prototype</title>
<style>
body{margin:0;background:#f3f6fb;color:#152b43;font:15px system-ui,sans-serif}
header{padding:16px 24px;background:#102b4b;color:white;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header strong{font-size:21px}button,.upload{border:0;border-radius:8px;background:#f78d39;color:#152b43;padding:10px 14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}main{max-width:1000px;margin:20px auto;padding:0 16px}
#pages{display:grid;gap:20px;justify-items:center}.page{position:relative;box-shadow:0 5px 24px #17304b33;background:white}
.page canvas{display:block;max-width:100%}.span{position:absolute;cursor:text;outline:1px solid transparent;color:transparent;white-space:pre;overflow:hidden}
.span:hover,.span:focus{outline:2px solid #fa8a2d;background:#fba65033}
#editor{position:sticky;top:0;z-index:3;background:white;padding:14px;box-shadow:0 2px 12px #17304b20;border-radius:10px;margin-bottom:18px}
textarea{display:block;box-sizing:border-box;width:100%;min-height:75px;margin:8px 0;padding:10px;font:inherit}
#status{padding:12px 0}small{color:#516478}
</style>
</head>
<body>
<header><strong>🐙 PDFaspect — Edit PDF</strong><label class="upload">Open PDF <input type="file" id="file" accept="application/pdf" hidden></label><button id="export" disabled>Export changes JSON</button></header>
<main><section id="editor" hidden><b id="selection"></b><textarea id="replacement" aria-label="Replacement text"></textarea><button id="apply">Stage change</button> <button id="undo">Undo last</button><p><small>This is a preview prototype. Exported changes are NOT a modified PDF. PDF saving will be connected to a validated server endpoint later.</small></p></section><div id="status">Choose a PDF to preview and select its text.</div><div id="pages"></div></main>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const file=document.getElementById('file'),pages=document.getElementById('pages'),status=document.getElementById('status'),editor=document.getElementById('editor'),selection=document.getElementById('selection'),replacement=document.getElementById('replacement'),exportBtn=document.getElementById('export');
let changes=[],chosen=null;
file.addEventListener('change',async()=>{
  const f=file.files[0];if(!f)return;
  pages.replaceChildren();editor.hidden=true;changes=[];chosen=null;exportBtn.disabled=true;
  try{
    const data=new Uint8Array(await f.arrayBuffer());
    const pdf=await pdfjsLib.getDocument({data}).promise;
    status.textContent=`Loaded ${pdf.numPages} pages. Click highlighted text to edit.`;
    for(let number=1;number<=pdf.numPages;number++){
      const page=await pdf.getPage(number),viewport=page.getViewport({scale:1.4});
      const wrapper=document.createElement('div');wrapper.className='page';
      wrapper.style.width=viewport.width+'px';wrapper.style.height=viewport.height+'px';
      const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
      wrapper.append(canvas);pages.append(wrapper);
      await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
      const text=await page.getTextContent();let index=0;
      for(const item of text.items){
        if(!item.str?.trim())continue;
        const tx=pdfjsLib.Util.transform(viewport.transform,item.transform);
        const fontHeight=Math.hypot(tx[2],tx[3]);
        const div=document.createElement('div');div.className='span';div.tabIndex=0;
        div.setAttribute('role','button');div.setAttribute('aria-label','Edit '+item.str);
        div.style.left=tx[4]+'px';div.style.top=(tx[5]-fontHeight)+'px';
        div.style.width=Math.max(4,item.width*viewport.scale)+'px';div.style.height=Math.max(5,fontHeight)+'px';
        const original=item.str,occurrence=index++;
        div.title=original;
        const pick=()=>{
          chosen={page:number-1,old_text:original,new_text:original,occurrence,element:div};
          editor.hidden=false;selection.textContent=`Page ${number}: ${original}`;
          replacement.value=original;replacement.focus();
        };
        div.addEventListener('click',pick);div.addEventListener('keydown',e=>{if(e.key==='Enter')pick()});
        wrapper.append(div);
      }
    }
  }catch(err){status.textContent='Unable to open PDF: '+err.message}
});
document.getElementById('apply').addEventListener('click',()=>{
 if(!chosen||!replacement.value.trim())return;
 changes=changes.filter(c=>!(c.page===chosen.page&&c.occurrence===chosen.occurrence));
 changes.push({page:chosen.page,old_text:chosen.old_text,new_text:replacement.value,occurrence:chosen.occurrence});
 chosen.element.style.outline='2px solid #16a085';exportBtn.disabled=false;
 status.textContent=`${changes.length} staged change(s). Export JSON for review.`;
});
document.getElementById('undo').addEventListener('click',()=>{
 const last=changes.pop();if(!last)return;
 exportBtn.disabled=changes.length===0;status.textContent=`${changes.length} staged change(s).`;
});
exportBtn.addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify({schema_version:1,changes},null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pdfaspect-edits.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
});
</script></body></html>
