<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDFaspect — Text editor prototype</title>
<style>
body{margin:0;background:#f3f6fb;color:#152b43;font:15px system-ui,sans-serif}
header{padding:16px 24px;background:#102b4b;color:white;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header strong{font-size:21px}button,.upload{border:0;border-radius:8px;background:#f78d39;color:#152b43;padding:10px 14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}main{max-width:1000px;margin:20px auto;padding:0 16px}
#pages{display:grid;gap:20px;justify-items:center}.page{position:relative;box-shadow:0 5px 24px #17304b33;background:white;max-width:100%;height:auto!important;aspect-ratio:var(--page-ratio)}
.page img{display:block;max-width:100%}.span{position:absolute;z-index:2;cursor:pointer;outline:1px solid transparent;color:transparent;white-space:pre;overflow:visible;min-height:22px;touch-action:manipulation}
.span:hover,.span:focus,.span:active{outline:2px solid #fa8a2d;background:#fba65055}
#editor{position:sticky;top:0;z-index:3;background:white;padding:14px;box-shadow:0 2px 12px #17304b20;border-radius:10px;margin-bottom:18px}
textarea{display:block;box-sizing:border-box;width:100%;min-height:75px;margin:8px 0;padding:10px;font:inherit}
#status{padding:12px 0}small{color:#516478}
</style>
</head>
<body>
<header><strong>🐙 PDFaspect — Edit PDF</strong><label class="upload">Open PDF <input type="file" id="file" accept="application/pdf" hidden></label><button id="export" disabled>Export changes JSON</button><button id="save" disabled>Download edited PDF (experimental)</button></header>
<main><section id="editor" hidden><b id="selection"></b><textarea id="replacement" aria-label="Replacement text"></textarea><button id="apply">Stage change</button> <button id="undo">Undo last</button><p><small>Experimental editor. PDF saving requires the server feature flag and may reject complex layouts.</small></p></section><div id="status">Choose a PDF to preview and select its text.</div><div id="pages"></div></main>
<script type="module" src="/static/edit-pdf-prototype.js"></script></body></html>
