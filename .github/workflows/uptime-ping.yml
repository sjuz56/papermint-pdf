name: PDFaspect uptime ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping PDFaspect
        run: |
          curl --fail --silent --show-error --max-time 60 https://pdfaspect.com/ > /dev/null
