name: PDF edit prototype tests
on:
  push:
    branches: [feature/advanced-pdf-text-edit]
  pull_request:
    paths:
      - "papermint_edit_*.py"
      - "tests/test_pdf_edit_engine.py"
      - "tests/test_pdf_edit_api.py"
      - "static/edit-pdf-prototype.html"
      - ".github/workflows/pdf-edit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install editor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF==1.28.2 fastapi httpx python-multipart
      - name: Check Python syntax
        run: python -m py_compile papermint_edit_engine.py papermint_edit_api.py tests/test_pdf_edit_engine.py tests/test_pdf_edit_api.py
      - name: Check editor browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("static/edit-pdf-prototype.html").read_text(encoding="utf-8")
          start = html.index('<script type="module">') + len('<script type="module">')
          end = html.index("</script>", start)
          Path("/tmp/pdfaspect-editor.mjs").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/pdfaspect-editor.mjs
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_pdf_edit_engine.py' -v
          python -m unittest discover -s tests -p 'test_pdf_edit_api.py' -v
