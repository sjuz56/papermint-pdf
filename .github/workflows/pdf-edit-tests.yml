name: PDF edit prototype tests
on:
  push:
    branches: [feature/advanced-pdf-text-edit]
  pull_request:
    paths:
      - "papermint_edit_*.py"
      - "tests/test_pdf_edit_engine.py"
      - "tests/test_pdf_edit_api.py"
      - "static/edit-pdf-prototype.html"
      - "static/edit-pdf-prototype.js"
      - "tests/browser_pdf_edit_*.py"
      - ".github/workflows/pdf-edit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install editor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF==1.28.2 fastapi httpx python-multipart uvicorn playwright==1.55.0
      - name: Check Python syntax
        run: python -m py_compile papermint_edit_engine.py papermint_edit_api.py tests/test_pdf_edit_engine.py tests/test_pdf_edit_api.py
      - name: Check browser script and CSP compatibility
        run: |
          node --check static/edit-pdf-prototype.js
          python - <<'PY'
          from pathlib import Path
          html = Path('static/edit-pdf-prototype.html').read_text(encoding='utf-8')
          assert 'src="/static/edit-pdf-prototype.js"' in html
          assert '<script type="module">' not in html
          PY
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_pdf_edit_engine.py' -v
          python -m unittest discover -s tests -p 'test_pdf_edit_api.py' -v

      - name: Test PDF editor in real Chromium browser
        run: python tests/browser_pdf_edit_smoke.py
